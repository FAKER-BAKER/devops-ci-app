name: CI — verify and publish image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - run: python -m pylint app --score=no
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Normalize image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Build image
        run: docker build --tag "devops-ci-app:$GITHUB_SHA" .
      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs smoke || true; docker rm -f smoke || true' EXIT
          docker run -d --name smoke -p 127.0.0.1:5000:5000 "devops-ci-app:$GITHUB_SHA"
          curl --fail --silent --show-error --retry 14 --retry-all-errors --retry-delay 1 --max-time 2 http://127.0.0.1:5000/health --output health.json
          python3 -m json.tool health.json
          python3 -c 'import json; assert json.load(open("health.json", encoding="utf-8")) == {"status": "ok"}'
          docker exec smoke id
          test "$(docker exec smoke id -u)" -ne 0
      - name: Tag registry image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9][A-Za-z0-9_.-]*)?$ ]]
            docker tag "devops-ci-app:$GITHUB_SHA" "$IMAGE_NAME:$version"
          else
            docker tag "devops-ci-app:$GITHUB_SHA" "$IMAGE_NAME:$GITHUB_SHA"
            docker tag "devops-ci-app:$GITHUB_SHA" "$IMAGE_NAME:latest"
          fi
      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker push "$IMAGE_NAME:${GITHUB_REF_NAME#v}" | tee push-release.log
            grep 'digest: sha256:' push-release.log
          else
            docker push "$IMAGE_NAME:$GITHUB_SHA" | tee push-sha.log
            docker push "$IMAGE_NAME:latest" | tee push-latest.log
            grep 'digest: sha256:' push-sha.log push-latest.log
          fi
